name: XXQCRAFT Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: GitHub Pages Ayarla
        uses: actions/configure-pages@v5

      - name: Web Dosyalarini Yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: GitHub Pages Yayina Al
        id: deployment
        uses: actions/deploy-pages@v4
